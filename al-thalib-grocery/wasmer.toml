[package]
name = "al-thalib-grocery"
version = "1.0.0"
description = "Al Thalib Grocery Management System — Ihala Kotramulla, Sri Lanka"

[dependencies]
"sharrattj/static-web-server" = "1"

[fs]
"/public" = "public"

[[command]]
name = "server"
module = "sharrattj/static-web-server:webserver"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
env = ["SERVER_PORT=8080", "SERVER_ROOT=/public"]
